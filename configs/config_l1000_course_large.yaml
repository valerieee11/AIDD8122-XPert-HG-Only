dataset:
  atom_num: 24
  cdsdb:
    num_cell_id: 14
    num_pert_dose: 11
    num_pert_time: 8
    num_tissue_id: 14
  drug_unimol_path: processed_data/course_hg_only_large_placeholder.npy
  gene_num: 978
  l1000:
    num_cell_id: 240
    num_pert_dose: 10
    num_pert_time: 3
    num_tissue_id: 21
  max_atom_size: 2
  max_value: 15.002
  min_value: 0.0
  n_bins: 128
  panacea:
    num_cell_id: 240
    num_pert_dose: 10
    num_pert_time: 3
    num_tissue_id: 21
finetune:
  exclude_keys: []
  finetune_lr: 0.001
  finetune_params: all
  init_epoch: 0
  weight_decay: 1.0e-05
model:
  ATTN:
    attention_probs_dropout_prob: 0.1
    cell_input_hidden_dropout_prob: 0.1
    ctl_structure: SA+SA+SA+SA
    drug_input_hidden_dropout_prob: 0.1
    hidden_dropout_prob: 0.1
    hidden_size: 256
    n_heads: 8
    ppi_gene_vector_path: processed_data/PPI_gene_vector_128d.npy
    sparse_flag: false
    topk_cell: 128
    topk_drug: 32
    trt_structure: CA+SA+SA+CA
  HG:
    conv_layers: 2
    drug_hg_pretrained_embed_path: HG_data/saved_embedding/HG_drug_embeddings.npy
    hg_path: HG_data/
    node_input_dim: 512
train:
  bandwidth: 0.3
  batch_size: 1
  init_epoch: 0
  loss_weight:
  - 0.2
  - 0.003
  - 0.2
  - 1
  num_epochs: 10
  patience: 50
  train_lr: 0.002
  weight_decay: 1.0e-05
